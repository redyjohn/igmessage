<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IG Comment Analyzer 報告</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:#f6f7fb}.hero{background:linear-gradient(120deg,#833ab4,#fd1d1d,#fcb045);color:white}.card{border:0;box-shadow:0 3px 14px #00000012}.chart{width:100%;border-radius:.5rem}.table{font-size:.9rem}</style>
</head>
<body>
<header class="hero py-5 mb-4"><div class="container"><h1>IG Comment Analyzer</h1><p class="mb-0">Instagram 留言分析報告</p></div></header>
<main class="container pb-5">
 <h2 class="h4 mb-3">基本統計</h2><div class="row g-3 mb-4">
 
 <div class="col-6 col-lg-3"><div class="card p-3"><small class="text-muted">總留言數</small><strong class="fs-3">0</strong></div></div>
 <div class="col-6 col-lg-3"><div class="card p-3"><small class="text-muted">唯一留言者</small><strong class="fs-3">0</strong></div></div>
 <div class="col-6 col-lg-3"><div class="card p-3"><small class="text-muted">平均留言長度</small><strong class="fs-3">nan</strong></div></div>
 <div class="col-6 col-lg-3"><div class="card p-3"><small class="text-muted">應援留言數</small><strong class="fs-3">0</strong></div></div>
 </div><p>留言最多的人：<strong>—</strong>｜應援隊伍數：<strong>0</strong></p>

 <div class="row g-4 mb-4">
  <div class="col-12 col-lg-6"><div class="card p-3"><h2 class="h5">應援隊伍排行</h2><img class="chart" src="assets/team_votes.png" alt="應援隊伍排行"></div></div>
  <div class="col-12 col-lg-6"><div class="card p-3"><h2 class="h5">留言者排行</h2><img class="chart" src="assets/top_commenters.png" alt="留言者排行"></div></div>
 </div>

 <div class="row g-4 mb-4">
  <div class="col-12 col-lg-6"><div class="card p-3"><h2 class="h5">Top 20 應援隊伍</h2><table class="table"><thead><tr><th>隊伍</th><th>票數</th></tr></thead><tbody></tbody></table></div></div>
  <div class="col-12 col-lg-6"><div class="card p-3"><h2 class="h5">Top 20 留言者</h2><table class="table"><tbody></tbody></table></div></div>
 </div>

 <div class="row g-4 mb-4">
  
  <div class="col-12 col-lg-6"><div class="card p-3"><h2 class="h5">留言時間趨勢</h2><img class="chart" src="assets/daily_comments.png" alt="留言時間趨勢"></div></div>
  
  <div class="col-12 col-lg-6"><div class="card p-3"><h2 class="h5">關鍵字排行</h2><img class="chart" src="assets/keywords.png" alt="關鍵字排行"></div></div>
  
  <div class="col-12 col-lg-6"><div class="card p-3"><h2 class="h5">Emoji 排行</h2><img class="chart" src="assets/emojis.png" alt="Emoji 排行"></div></div>
  
  <div class="col-12 col-lg-6"><div class="card p-3"><h2 class="h5">留言長度分布</h2><img class="chart" src="assets/length_distribution.png" alt="留言長度分布"></div></div>
  
  <div class="col-12 col-lg-6"><div class="card p-3"><h2 class="h5">文字雲</h2><img class="chart" src="assets/wordcloud.png" alt="文字雲"></div></div>
  
 </div>

 <div class="row g-4">
  <div class="col-12"><div class="card p-3"><h2 class="h5">重複留言（前 20 筆）</h2><table class="table"><thead><tr><th>類型</th><th>留言</th><th>說明</th><th>相似度</th></tr></thead><tbody></tbody></table></div></div>
 </div>
</main></body></html>
