name: Scheduled data update

on:
  schedule:
    # Taiwan time (UTC+8): 10:00 and 22:00
    - cron: "0 2,14 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-ig-update
  cancel-in-progress: true

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Write credentials
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          POST_URL: ${{ vars.POST_URL }}
        run: |
          if [ -z "$IG_USERNAME" ] || [ -z "$IG_PASSWORD" ]; then
            echo "Missing IG_USERNAME or IG_PASSWORD secrets"
            exit 1
          fi
          if [ -z "$POST_URL" ]; then
            echo "Missing POST_URL repository variable"
            exit 1
          fi
          {
            echo "IG_USERNAME=${IG_USERNAME}"
            echo "IG_PASSWORD=${IG_PASSWORD}"
            echo "HEADLESS=true"
            echo "CRAWL_TIMEOUT_SECONDS=60"
            echo "MAX_RETRIES=3"
            echo "MAX_COMMENTS=0"
            echo "CRAWL_DELAY_SECONDS=0.35"
            echo "SKIP_PDF=true"
          } > .env
          if [ -n "$IG_SESSION_JSON" ]; then
            printf '%s' "$IG_SESSION_JSON" > session.json
          fi

      - name: Crawl, analyze, and publish Pages
        env:
          POST_URL: ${{ vars.POST_URL }}
          SKIP_PDF: "true"
          HEADLESS: "true"
        run: |
          python main.py all "$POST_URL"
          python publish_docs.py

      - name: Commit and push updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No docs changes to publish"
            exit 0
          fi
          git commit -m "chore: scheduled refresh of analysis report"
          git push
